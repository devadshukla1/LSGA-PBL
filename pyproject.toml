[project]
name = "smartroute-analytics"
version = "0.1.0"
description = "Academic dashboard for emergency routing and urban road network resilience."
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src", "src.*", "pages"]

[tool.setuptools]
py-modules = ["app", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

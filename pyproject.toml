[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metrograph-analytics"
version = "0.1.0"
description = "Intelligent Metro Route Optimization and Critical Station Analysis Using Graph Algorithms"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.30.0,<2.0.0",
    "networkx>=3.2.1,<4.0.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "plotly>=5.18.0,<6.0.0",
    "folium>=0.15.0,<1.0.0",
    "streamlit-folium>=0.16.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "ruff>=0.2.0,<1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "archive_road_network_project",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402"]
